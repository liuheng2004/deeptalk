<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeepTalk · 进入动画原型 (WebGL)</title>
<style>
  /* ============ 基础 ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #070510;
    color: #f4e9dd;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  /* ============ 启动层 ============ */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: #070510;
  }
  #splash-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 无 WebGL 时的纯 CSS 兜底(能力降级,不黑屏) */
  #splash.css-fallback #splash-canvas { display: none; }
  #splash.css-fallback {
    background:
      radial-gradient(42% 42% at 50% 46%, rgba(255, 120, 60, 0.34), transparent 70%),
      radial-gradient(80% 80% at 50% 60%, rgba(60, 20, 70, 0.55), transparent 80%),
      linear-gradient(180deg, #1a0f24 0%, #0a0714 58%, #070510 100%);
  }

  /* ============ Logo ============ */
  .logo { position: relative; z-index: 1; text-align: center; padding: 0 24px; }
  .wordmark {
    font-size: clamp(44px, 9vw, 76px);
    font-weight: 300;
    letter-spacing: 0.18em;
    text-indent: 0.18em; /* 抵消末位字距,保持视觉居中 */
    color: #f8efe4;
    text-shadow:
      0 0 26px rgba(255, 122, 62, 0.55),
      0 0 72px rgba(255, 140, 70, 0.28),
      0 0 140px rgba(255, 160, 90, 0.16);
    opacity: 0;
    transform: translateY(14px);
    animation: word-in 1.05s cubic-bezier(0.22, 1, 0.36, 1) 0.12s forwards;
  }
  .tagline {
    margin-top: 18px;
    font-size: 13px;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: rgba(244, 233, 221, 0.58);
    opacity: 0;
    animation: tag-in 1.1s ease-out 0.42s forwards;
  }
  @keyframes word-in {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes tag-in {
    to { opacity: 1; }
  }

  .hint {
    position: absolute;
    bottom: 44px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: rgba(244, 233, 221, 0.55);
    animation: hint-pulse 2.2s ease-in-out infinite;
  }
  @keyframes hint-pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.85; }
  }

  /* 减弱动效开关 */
  .motion-toggle {
    position: absolute;
    left: 18px;
    bottom: 16px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: rgba(244, 233, 221, 0.72);
    cursor: pointer;
    opacity: 0.85;
  }
  .motion-toggle input { accent-color: #ff8a52; cursor: pointer; }

  /* ============ 减弱动效档 ============ */
  #splash.reduced .wordmark { animation-duration: 0.45s; animation-delay: 0s; }
  #splash.reduced .tagline { animation-duration: 0.5s; animation-delay: 0.12s; }
  #splash.reduced .hint { animation: none; opacity: 0.7; }

  /* ============ 退出 ============ */
  #splash.splash-exit { opacity: 0; transition: opacity 0.28s ease; pointer-events: none; }
  #splash.splash-exit .logo { transform: translateY(-8px) scale(0.992); opacity: 0; transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease; }

  /* 重播按钮 */
  #replay {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    z-index: 998;
    padding: 9px 18px;
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: #f4e9dd;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  #replay:hover { background: rgba(255, 255, 255, 0.12); }
  #replay:focus-visible { outline: 2px solid rgba(255, 138, 82, 0.8); outline-offset: 3px; }
</style>
</head>
<body>

  <!-- 启动层:WebGL 氛围 shader + HTML Logo(比 shader 画文字更清晰) -->
  <div id="splash" role="button" tabindex="0" aria-label="点击进入 DeepTalk">
    <canvas id="splash-canvas" aria-hidden="true"></canvas>
    <div class="logo">
      <div class="wordmark">DeepTalk</div>
      <div class="tagline">让每一段值得记住的对话,不被遗忘</div>
    </div>
    <div class="hint">点击进入</div>
    <label class="motion-toggle">
      <input type="checkbox" id="motion-toggle" /> 减弱动效
    </label>
  </div>

  <button id="replay" hidden>重新播放进入动画</button>

<script>
(function () {
  'use strict';

  /* ================= 配置(可调) ================= */
  var SPLASH_DURATION_MS = 3200;      // 动画总时长:3.2s(需求 2~4s)
  var EXIT_FADE_START_S = 2.75;       // shader 淡出起始
  var EXIT_FADE_END_S = 3.20;         // shader 淡出结束(= 自动退出)
  var REDUCED_DURATION_MS = 1200;     // 减弱动效档时长
  var DPR_CAP = 1.5;                  // 像素比封顶,省 GPU
  var LS_KEY = 'deeptalk:reducedMotion'; // 设置开关持久化键(未来接入 App 设置)

  var overlay = document.getElementById('splash');
  var canvas = document.getElementById('splash-canvas');
  var replayBtn = document.getElementById('replay');
  var toggle = document.getElementById('motion-toggle');

  /* ================= 状态 ================= */
  var gl = null, program = null;
  var uResolution = null, uTime = null;
  var rafId = 0, startTs = 0;
  var dismissed = false, cssFallback = false;
  var dismissTimer = 0;

  /* 减弱动效:系统偏好 OR 用户开关(本地持久化) */
  var reduced = false;
  try {
    reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
              localStorage.getItem(LS_KEY) === '1';
  } catch (e) { reduced = false; }
  toggle.checked = reduced;
  if (reduced) overlay.classList.add('reduced');

  /* ================= WebGL 初始化 ================= */
  function setupGL() {
    // 关闭抗锯齿/深度/模板,不保留绘制缓冲 —— 全是低功耗关键项
    var attrs = {
      alpha: true,
      antialias: false,
      depth: false,
      stencil: false,
      preserveDrawingBuffer: false,
      premultipliedAlpha: false,
      powerPreference: 'high-performance'
    };
    try {
      gl = canvas.getContext('webgl', attrs) ||
           canvas.getContext('experimental-webgl', attrs);
    } catch (e) { gl = null; }
    if (!gl) { cssFallback = true; overlay.classList.add('css-fallback'); return; }

    var vs = [
      'attribute vec2 aPosition;',
      'varying vec2 vUv;',
      'void main(){',
      '  vUv = aPosition * 0.5 + 0.5;',
      '  gl_Position = vec4(aPosition, 0.0, 1.0);',
      '}'
    ].join('\n');

    var fs = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform vec2 uResolution;',
      'uniform float uTime;',
      '',
      'float ease(float v){ v = clamp(v, 0.0, 1.0); return v * v * (3.0 - 2.0 * v); }',
      '',
      'void main(){',
      '  vec2 p = vUv * 2.0 - 1.0;',
      '  p.x *= uResolution.x / max(uResolution.y, 1.0);',
      '  float t = uTime;',
      '',
      '  /* 全屏氛围渐变(暖暗,贴合 DeepTalk 情感色调) */',
      '  vec3 cTop = vec3(0.16, 0.08, 0.15);',
      '  vec3 cBottom = vec3(0.025, 0.012, 0.045);',
      '  vec3 col = mix(cBottom, cTop, smoothstep(0.0, 1.0, vUv.y));',
      '',
      '  /* 中心 logo 光晕:径向衰减 + 呼吸脉动 */',
      '  float d = length(p);',
      '  float pulse = 0.5 + 0.5 * sin(t * 1.5);',
      '  float glow = exp(-d * d * 2.4);',
      '  vec3 warm = vec3(1.0, 0.48, 0.26) * (0.55 + 0.28 * pulse);',
      '  col += warm * glow;',
      '',
      '  /* 外圈冷色光环,给光晕一点层次 */',
      '  float halo = exp(-pow(d - 0.58, 2.0) * 3.2);',
      '  col += vec3(0.35, 0.62, 0.85) * halo * 0.10;',
      '',
      '  /* 一道很轻的斜向扫光,廉价但增加"进入感" */',
      '  float sweep = exp(-pow(vUv.x * 1.7 - 0.85 + sin(t * 0.45) * 0.08, 2.0) * 16.0);',
      '  col += vec3(1.0, 0.92, 0.82) * sweep * 0.045;',
      '',
      '  /* 暗角 */',
      '  col *= 0.45 + 0.85 * smoothstep(1.5, 0.35, length(p));',
      '',
      '  /* 极轻噪点,避免色带 */',
      '  float grain = fract(sin(dot(vUv, vec2(12.9898, 78.233)) + t * 36.0) * 43758.5453);',
      '  col += (grain - 0.5) * 0.015;',
      '',
      '  /* 时间包络:0.6s 淡入,2.75~3.2s 淡出 */',
      '  float intro = ease(t / 0.6);',
      '  float outT = clamp((t - ' + EXIT_FADE_START_S + ') / ' + (EXIT_FADE_END_S - EXIT_FADE_START_S).toFixed(2) + ', 0.0, 1.0);',
      '  float env = intro * (1.0 - ease(outT));',
      '  col *= env;',
      '',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n');

    function compile(type, src) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        console.warn('DeepTalk splash shader compile failed:', gl.getShaderInfoLog(sh));
        gl.deleteShader(sh);
        return null;
      }
      return sh;
    }

    var vsh = compile(gl.VERTEX_SHADER, vs);
    var fsh = compile(gl.FRAGMENT_SHADER, fs);
    if (!vsh || !fsh) { cssFallback = true; overlay.classList.add('css-fallback'); return; }

    program = gl.createProgram();
    gl.attachShader(program, vsh);
    gl.attachShader(program, fsh);
    gl.linkProgram(program);
    gl.deleteShader(vsh);
    gl.deleteShader(fsh);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.warn('DeepTalk splash program link failed:', gl.getProgramInfoLog(program));
      gl.deleteProgram(program);
      program = null;
      cssFallback = true;
      overlay.classList.add('css-fallback');
      return;
    }

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var pos = gl.getAttribLocation(program, 'aPosition');
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
    uResolution = gl.getUniformLocation(program, 'uResolution');
    uTime = gl.getUniformLocation(program, 'uTime');
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);
  }

  /* ================= 尺寸与绘制 ================= */
  function resize() {
    var dpr = Math.min(DPR_CAP, window.devicePixelRatio || 1);
    var w = Math.max(1, Math.floor(window.innerWidth * dpr));
    var h = Math.max(1, Math.floor(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    if (gl) gl.viewport(0, 0, w, h);
  }

  function draw(sec) {
    if (!gl || !program) return;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(program);
    gl.uniform2f(uResolution, canvas.width, canvas.height);
    gl.uniform1f(uTime, sec);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* ================= 动画循环(只跑 2~4s,结束即销毁) ================= */
  function frame(now) {
    if (dismissed) return;
    var t = (now - startTs) / 1000;
    draw(t);
    if (t >= SPLASH_DURATION_MS / 1000) {
      dismiss(false);
      return;
    }
    rafId = requestAnimationFrame(frame);
  }

  function start() {
    startTs = performance.now();
    resize();
    window.addEventListener('resize', resize);

    if (reduced) {
      // 减弱动效:只画一帧静态画面,不跑 rAF 循环,短时长后自动进入
      draw(0.9);
      dismissTimer = setTimeout(function () { dismiss(false); }, REDUCED_DURATION_MS);
    } else {
      rafId = requestAnimationFrame(frame);
    }
  }

  /* ================= 退出与销毁 ================= */
  function dismiss(manual) {
    if (dismissed) return;
    dismissed = true;
    if (rafId) cancelAnimationFrame(rafId);
    if (dismissTimer) clearTimeout(dismissTimer);
    window.removeEventListener('resize', resize);

    overlay.classList.add('splash-exit');
    setTimeout(function () {
      // 销毁 GL 上下文 + 移除 canvas,动画期间外零运行开销
      if (gl) {
        try {
          var ext = gl.getExtension('WEBGL_lose_context');
          if (ext) ext.loseContext();
        } catch (e) { /* ignore */ }
        gl = null;
      }
      if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
      overlay.style.display = 'none';
      replayBtn.hidden = false;
    }, 300);
  }

  function replay() {
    dismissed = false;
    rafId = 0;
    dismissTimer = 0;
    replayBtn.hidden = true;
    overlay.style.display = 'flex';
    overlay.classList.remove('splash-exit');
    overlay.classList.remove('css-fallback');
    // 退出时 canvas 已销毁,这里重建一个干净的画布
    if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
    canvas = document.createElement('canvas');
    canvas.id = 'splash-canvas';
    canvas.setAttribute('aria-hidden', 'true');
    overlay.insertBefore(canvas, overlay.firstChild);
    setupGL();
    start();
  }

  /* ================= 交互 ================= */
  overlay.addEventListener('click', function () { dismiss(true); });
  overlay.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      dismiss(true);
    }
  });

  toggle.addEventListener('change', function () {
    try {
      localStorage.setItem(LS_KEY, toggle.checked ? '1' : '0');
    } catch (e) { /* ignore */ }
    // 原型阶段:切换后重载,立即生效(正式接入 App 后改为动态切换)
    location.reload();
  });

  replayBtn.addEventListener('click', replay);

  /* ================= 启动 ================= */
  setupGL();
  start();
})();
</script>
</body>
</html>
