[package]
name = "deeptalk"
version = "0.1.0"
description = "DeepTalk — 微信深度对话的记忆与回应工具"
authors = ["DeepTalk Contributors"]
edition = "2021"

[lib]
name = "deeptalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
dirs = "5"
log = "0.4"
env_logger = "0.11"
